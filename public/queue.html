<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miranda Clinics Queue</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/assets/logo-only.ico" type="image/x-icon" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">
          <img src="/assets/logo-only.png" alt="Miranda Clinic Logo" class="logo-image" />
          <div class="logo-text">
            <h2>MIRANDA CLINICS</h2>
            <p>Queue Management System</p>
          </div>
        </div>
        <button type="button" class="login-btn" data-auth-button="login">Login</button>
      </header>

      <main>
        <div class="rooms" id="queueRoot"></div>
      </main>

      <footer>
        <h1>Now Serving</h1>
        <p>Please proceed when your number is displayed.</p>
      </footer>
    </div>

    <div class="login-overlay hidden" id="loginOverlay">
      <div class="login-card">
        <h2>Access required</h2>
        <p>Enter your admin credentials to continue.</p>
        <form id="loginForm">
          <label for="usernameInput">Username</label>
          <input id="usernameInput" type="text" autocomplete="username" required />
          <label for="passwordInput">Password</label>
          <input id="passwordInput" type="password" autocomplete="current-password" required />
          <button type="submit">Login</button>
          <p class="login-error" id="loginError"></p>
        </form>
      </div>
    </div>

    <script src="/auth.js"></script>
    <script src="/queue.js"></script>
  </body>
</html>
